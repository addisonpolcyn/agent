[project]
name = "agentlab"
version = "0.1.0"
description = "A small, evaluation-driven agent that discovers and uses tools."
requires-python = ">=3.14"
authors = [{ name = "Addison Polcyn", email = "addisonpolcyn@gmail.com" }]
dependencies = ["anthropic>=1.12"]

[project.scripts]
agentlab = "agentlab.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
    "pyright[nodejs]>=1.1.414",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "TC", "PL", "C4", "PIE", "RET"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
executionEnvironments = [
  { root = "src" },
  # Tests poke at private helpers and hand-built SDK objects; keep them typed but less pedantic.
  { root = "tests", reportPrivateUsage = false },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not live", "--strict-markers"]
markers = ["live: calls real external services; opt in with AGENTLAB_LIVE_TESTS=1"]
