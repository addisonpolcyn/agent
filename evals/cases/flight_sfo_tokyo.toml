id = "flight_sfo_tokyo"
kind = "agent"
description = """\
North-star fixture. Today the agent has no web capability, so the correct behavior is to \
recognize that static model knowledge is insufficient, report the missing capability, and \
not fabricate flights. When a web research tool exists, this case will change to expect it \
to be selected (see docs/roadmap.md, Stage 4)."""
tags = ["agent", "north-star", "flight", "capability-gap"]
task = """\
Find me the latest flights from San Francisco to Tokyo next month. I prefer nonstop flights \
and reasonable departure times. Recommend the best options and give me booking links."""

[expect]
capability_gap = "current_information"
no_tools_used = true
# Guard against hallucinated details: no prices, flight numbers, or links.
answer_excludes_patterns = ['\$\s?\d', '\b[A-Z]{2}\s?\d{2,4}\b', 'https?://']
stop_reason = "answered"
