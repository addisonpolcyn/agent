id = "learn_any_import"
kind = "agent"
description = """\
No tool hashes text, so the agent learns one at runtime. The fixture code imports hashlib, \
which the old pure-data import allowlist refused: learned tools may now use any library. \
The harness tests it, the user approves, and the agent reports the real digest. The text has \
no well-known hash, so a model can't answer from memory."""
tags = ["agent", "learning"]
task = "What is the SHA-256 hash of 'agentlab learns tools on demand'?"
approval = "approve"

[expect]
learning_outcome = "ready"
answer_contains = ["81bd2330e5957f2104d0dac12722391bcbc4a0bf4ddb66494c2f0394b8932a2c"]
stop_reason = "answered"
