id = "learn_word_count"
kind = "agent"
description = """\
On-demand learning, approved once, at the plan. No tool counts words, so the agent proposes a \
generic tool, the harness builds and tests it in the sandbox, and the agent uses it to answer."""
tags = ["agent", "learning"]
task = """\
I'll need word counts for a lot of documents, so build a reusable tool for it. Start with: \
count the words in 'the quick brown fox jumps over the lazy dog'"""
approval = "approve"

[expect]
learning_outcome = "ready"
answer_contains = ["9"]
stop_reason = "answered"
